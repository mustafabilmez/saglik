<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Sigara Kullanımı ve Nikotin Bağımlılığı Değerlendirmesi</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Newsreader:opsz,wght@6..72,500;6..72,600&family=Public+Sans:wght@400;500;600&display=swap&subset=latin-ext" rel="stylesheet">
<style>
  :root {
    --bg: #ffffff;
    --surface: #ffffff;
    --soft: #f3f8f8;
    --ink: #12303b;
    --muted: #4d6a73;
    --line: #d3e1e3;
    --brand: #0f6e75;
    --brand-strong: #0a5459;
    --brand-tint: #e3f2f2;
    --on-brand: #ffffff;
    --low: #2b8a66;
    --mid: #c27f12;
    --high: #b8433a;
    --shadow: 0 1px 2px rgba(18,48,59,.06), 0 8px 24px rgba(18,48,59,.07);
    --radius-lg: 20px;
    --radius-md: 14px;
    --radius-sm: 10px;
    --font-body: "Public Sans", system-ui, -apple-system, "Segoe UI", Roboto, Arial, sans-serif;
    --font-head: "Newsreader", Georgia, "Times New Roman", serif;
    box-sizing: border-box;
    padding-top: env(safe-area-inset-top, 0px);
    padding-bottom: env(safe-area-inset-bottom, 0px);
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg: #0e1b20; --surface: #15272e; --soft: #101f25; --ink: #e8f1f2; --muted: #9fb7bd;
      --line: #28414a; --brand: #5cc4c9; --brand-strong: #86d6da; --brand-tint: #17363b; --on-brand: #06262a;
      --low: #5cc79d; --mid: #e5ac4a; --high: #e8837a;
      --shadow: 0 1px 2px rgba(0,0,0,.3), 0 8px 24px rgba(0,0,0,.3);
    }
  }
  :root[data-theme="dark"] {
    --bg: #0e1b20; --surface: #15272e; --soft: #101f25; --ink: #e8f1f2; --muted: #9fb7bd;
    --line: #28414a; --brand: #5cc4c9; --brand-strong: #86d6da; --brand-tint: #17363b; --on-brand: #06262a;
    --low: #5cc79d; --mid: #e5ac4a; --high: #e8837a;
    --shadow: 0 1px 2px rgba(0,0,0,.3), 0 8px 24px rgba(0,0,0,.3);
  }

  *, *::before, *::after { box-sizing: inherit; }
  html { height: 100%; scroll-padding-top: env(safe-area-inset-top, 0px); -webkit-text-size-adjust: 100%; }
  body {
    min-height: 100%;
    margin: 0;
    background: var(--bg);
    color: var(--ink);
    font-family: var(--font-body);
    font-size: 1.0625rem;
    line-height: 1.6;
    display: flex;
    flex-direction: column;
  }

  .site-header { border-bottom: 1px solid var(--line); background: var(--surface); }
  .site-header-inner {
    max-width: 760px; margin: 0 auto; padding: 14px 20px;
    display: flex; align-items: center; gap: 10px; color: var(--brand-strong); font-weight: 600; font-size: .98rem;
  }
  .site-header svg { flex: none; }

  main { flex: 1; width: 100%; max-width: 760px; margin: 0 auto; padding: 28px 20px 40px; }
  main:focus { outline: none; }

  h1, h2 { font-family: var(--font-head); font-weight: 600; line-height: 1.2; margin: 0; letter-spacing: -.01em; }
  h1 { font-size: clamp(1.9rem, 5.6vw, 2.75rem); }
  h2 { font-size: clamp(1.4rem, 4.2vw, 1.85rem); }
  h1:focus, h2:focus { outline: none; }
  p { margin: 0; }

  .card {
    background: var(--surface);
    border: 1px solid var(--line);
    border-radius: var(--radius-lg);
    box-shadow: var(--shadow);
    padding: clamp(22px, 5vw, 40px);
  }

  /* Home */
  .lead { color: var(--muted); font-size: 1.15rem; margin-top: 16px; max-width: 58ch; }
  .home-facts { display: flex; flex-wrap: wrap; gap: 10px; margin: 26px 0 30px; padding: 0; list-style: none; }
  .home-facts li {
    background: var(--brand-tint); color: var(--brand-strong);
    border-radius: 999px; padding: 6px 14px; font-size: .94rem; font-weight: 500;
  }
  .notice {
    margin-top: 26px; padding: 14px 16px; border-radius: var(--radius-md);
    background: var(--soft); border: 1px solid var(--line); color: var(--muted); font-size: .94rem;
    display: flex; gap: 12px; align-items: flex-start;
  }
  .notice svg { flex: none; margin-top: 3px; color: var(--brand); }

  /* Buttons */
  .btn {
    appearance: none; font: inherit; font-weight: 600; cursor: pointer;
    min-height: 52px; padding: 0 28px; border-radius: var(--radius-md);
    border: 2px solid transparent; transition: background-color .15s, border-color .15s, color .15s;
    display: inline-flex; align-items: center; justify-content: center; gap: 8px;
  }
  .btn-primary { background: var(--brand); color: var(--on-brand); }
  .btn-primary:hover:not(:disabled) { background: var(--brand-strong); }
  .btn-primary:disabled { background: var(--line); color: var(--muted); cursor: not-allowed; }
  .btn-secondary { background: transparent; color: var(--brand-strong); border-color: var(--line); }
  .btn-secondary:hover { border-color: var(--brand); background: var(--brand-tint); }
  .btn-lg { min-height: 60px; padding: 0 40px; font-size: 1.15rem; }
  .btn:focus-visible, .option input:focus-visible + .option-body {
    outline: 3px solid var(--brand); outline-offset: 3px;
  }

  /* Progress */
  .progress { margin-bottom: 22px; }
  .progress-top { display: flex; justify-content: space-between; align-items: baseline; margin-bottom: 10px; }
  .progress-label { font-weight: 600; color: var(--brand-strong); }
  .progress-pct { color: var(--muted); font-size: .92rem; }
  .bar { height: 10px; background: var(--brand-tint); border-radius: 999px; overflow: hidden; }
  .bar-fill { height: 100%; background: var(--brand); border-radius: 999px; transition: width .25s ease; }

  /* Question */
  fieldset { border: 0; margin: 0; padding: 0; min-width: 0; }
  legend { padding: 0; margin: 0 0 22px; width: 100%; }
  legend h2 { display: block; }
  .options { display: grid; gap: 12px; }
  .option { display: block; position: relative; cursor: pointer; }
  .option input {
    position: absolute; opacity: 0; width: 100%; height: 100%; margin: 0; cursor: pointer; z-index: 1;
  }
  .option-body {
    display: flex; align-items: center; gap: 16px;
    min-height: 62px; padding: 14px 18px;
    border: 2px solid var(--line); border-radius: var(--radius-md);
    background: var(--surface); font-weight: 500; transition: border-color .15s, background-color .15s;
  }
  .option:hover .option-body { border-color: var(--brand); }
  .mark {
    flex: none; width: 26px; height: 26px; border-radius: 50%;
    border: 2px solid var(--muted); display: grid; place-items: center; transition: all .15s;
  }
  .mark svg { opacity: 0; width: 14px; height: 14px; color: var(--on-brand); }
  .option input:checked + .option-body { border-color: var(--brand); background: var(--brand-tint); }
  .option input:checked + .option-body .mark { background: var(--brand); border-color: var(--brand); }
  .option input:checked + .option-body .mark svg { opacity: 1; }

  .nav { display: flex; justify-content: space-between; gap: 12px; margin-top: 28px; }
  .nav .btn-primary { margin-left: auto; }

  /* Result */
  .result-head { text-align: center; }
  .result-head .kicker { color: var(--muted); font-weight: 500; margin-bottom: 6px; }
  .score {
    font-family: var(--font-head); font-weight: 600; font-size: clamp(3.2rem, 14vw, 5.4rem);
    line-height: 1.05; margin: 18px 0 4px; letter-spacing: -.02em;
  }
  .score small { font-size: .42em; color: var(--muted); font-weight: 500; margin-left: .15em; }
  .level-name { font-size: 1.35rem; font-weight: 600; }
  .level-name[data-level="low"] { color: var(--low); }
  .level-name[data-level="mid"] { color: var(--mid); }
  .level-name[data-level="high"] { color: var(--high); }

  .gauge { margin: 34px 0 10px; }
  .cells { display: grid; grid-template-columns: repeat(11, 1fr); gap: 4px; }
  .cell { height: 18px; border-radius: 5px; opacity: .22; background: var(--c); }
  .cell.on { opacity: 1; }
  .cell.current { outline: 3px solid var(--ink); outline-offset: 2px; }
  .cell-nums { display: grid; grid-template-columns: repeat(11, 1fr); gap: 4px; margin-top: 6px; text-align: center; font-size: .78rem; color: var(--muted); }
  .levels { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; margin-top: 18px; }
  .level-chip {
    text-align: center; padding: 10px 6px; border-radius: var(--radius-sm);
    border: 2px solid var(--line); color: var(--muted); font-weight: 500; font-size: .95rem;
  }
  .level-chip small { display: block; font-size: .78rem; font-weight: 400; }
  .level-chip.active { color: var(--ink); font-weight: 600; border-color: var(--c); background: var(--soft); }
  .level-chip .dot { display: inline-block; width: 10px; height: 10px; border-radius: 50%; background: var(--c); margin-right: 6px; }

  .result-note { margin-top: 28px; padding: 16px 18px; border-radius: var(--radius-md); background: var(--soft); border: 1px solid var(--line); }
  .result-note strong { display: block; margin-bottom: 4px; }
  .result-extra { margin-top: 16px; color: var(--muted); font-size: .98rem; }
  .actions { display: flex; flex-wrap: wrap; gap: 12px; margin-top: 28px; justify-content: center; }

  .answers { margin-top: 28px; }
  .answers h3 { font-size: 1rem; margin: 0 0 8px; }
  .answers ul { list-style: none; margin: 0; padding: 0; border: 1px solid var(--line); border-radius: var(--radius-md); overflow: hidden; }
  .answers li { padding: 10px 14px; font-size: .92rem; border-top: 1px solid var(--line); display: flex; justify-content: space-between; gap: 12px; }
  .answers li:first-child { border-top: 0; }
  .answers li span:first-child { color: var(--muted); }
  .answers li span:last-child { text-align: right; font-weight: 500; }

  footer { border-top: 1px solid var(--line); background: var(--soft); }
  footer p { max-width: 760px; margin: 0 auto; padding: 18px 20px; font-size: .88rem; color: var(--muted); }

  .sr-only { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }

  @media (max-width: 520px) {
    main { padding-top: 20px; }
    .btn-lg { width: 100%; padding: 0 20px; }
    .nav .btn { padding: 0 18px; }
    .levels { gap: 6px; }
    .level-chip { font-size: .85rem; }
    .cell-nums { font-size: .7rem; }
  }
  @media (prefers-reduced-motion: reduce) { * { transition: none !important; } }

  @media print {
    :root { --shadow: none; }
    body { background: #fff; color: #000; }
    .site-header, footer .no-print, .actions, .nav { display: none !important; }
    .card { border: 0; box-shadow: none; padding: 0; }
    .cell, .level-chip, .level-chip .dot { -webkit-print-color-adjust: exact; print-color-adjust: exact; }
  }
</style>
</head>
<body>

<header class="site-header">
  <div class="site-header-inner">
    <svg width="26" height="26" viewBox="0 0 24 24" fill="none" aria-hidden="true">
      <rect x="1.5" y="1.5" width="21" height="21" rx="6" stroke="currentColor" stroke-width="2"/>
      <path d="M12 6.5v11M6.5 12h11" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"/>
    </svg>
    <span>Sağlık Bilgilendirme Aracı</span>
  </div>
</header>

<main id="app" tabindex="-1" aria-live="polite"></main>

<footer>
  <p>Bu değerlendirme bir tıbbi tanı yerine geçmez. Cevaplarınız yalnızca bu tarayıcıda, sekme açık kaldığı sürece tutulur; hiçbir sunucuya gönderilmez.</p>
</footer>

<script>
/* ============================================================
   1) VERİ: Sorular, puanlar ve sonuç düzeyleri
   Soru eklemek/çıkarmak veya puan değiştirmek için yalnızca
   bu bölümü düzenlemek yeterlidir. Toplam ve düzey aralıkları
   otomatik hesaplanır.
   ============================================================ */
const QUESTIONS = [
  {
    id: "ilk-sigara",
    text: "Uyandıktan sonra ilk sigaranızı ne kadar süre sonra içersiniz?",
    options: [
      { label: "5 dakika içinde", score: 3 },
      { label: "6 - 30 dakika arasında", score: 2 },
      { label: "31 - 60 dakika arasında", score: 1 },
      { label: "60 dakikadan sonra", score: 0 }
    ]
  },
  {
    id: "yasak-yerler",
    text: "Sigara içmenin yasak olduğu (okul, hastane, sinema, otobüs vb.) yerlerde bu duruma uymakta zorlanıyor musunuz?",
    options: [
      { label: "Evet", score: 1 },
      { label: "Hayır", score: 0 }
    ]
  },
  {
    id: "vazgecilmesi-zor",
    text: "Günün hangi sigarasından vazgeçmek sizin için en zordur?",
    options: [
      { label: "Sabah içilen ilk sigara", score: 1 },
      { label: "Diğer zamanlarda içilen herhangi bir sigara", score: 0 }
    ]
  },
  {
    id: "gunluk-adet",
    text: "Günde ortalama kaç tane sigara içiyorsunuz?",
    options: [
      { label: "10 adet ve daha az", score: 0 },
      { label: "11 - 20 adet arası", score: 1 },
      { label: "21 - 30 adet arası", score: 2 },
      { label: "31 adet ve üzeri", score: 3 }
    ]
  },
  {
    id: "sabah-sikligi",
    text: "Sabahları günün diğer saatlerine göre daha sık sigara içiyor musunuz?",
    options: [
      { label: "Evet", score: 1 },
      { label: "Hayır", score: 0 }
    ]
  },
  {
    id: "hastalik",
    text: "Günün büyük kısmını yatakta geçirmenize neden olacak kadar hasta olsanız bile sigara içer misiniz?",
    options: [
      { label: "Evet", score: 1 },
      { label: "Hayır", score: 0 }
    ]
  }
];

/* Sonuç düzeyleri: min/max dahil. Aralıklar arasında boşluk olmamalıdır. */
const LEVELS = [
  { key: "low",  name: "Düşük nikotin bağımlılığı",        short: "Düşük", min: 0, max: 3, color: "var(--low)",
    extra: "Cevaplarınız düşük düzeyde bir bağımlılık örüntüsüne işaret ediyor. Yine de sigara, kullanım miktarından bağımsız olarak sağlık için risk taşır; bırakmayı düşünüyorsanız bir sağlık profesyoneliyle konuşabilirsiniz." },
  { key: "mid",  name: "Orta düzeyde nikotin bağımlılığı", short: "Orta",  min: 4, max: 6, color: "var(--mid)",
    extra: "Cevaplarınız orta düzeyde bir bağımlılık örüntüsüne işaret ediyor. Sigarayı bırakmak istiyorsanız, bir hekim veya sigara bırakma polikliniğinden destek almak süreci kolaylaştırabilir." },
  { key: "high", name: "Yüksek düzeyde nikotin bağımlılığı", short: "Yüksek", min: 7, max: 10, color: "var(--high)",
    extra: "Cevaplarınız yüksek düzeyde bir bağımlılık örüntüsüne işaret ediyor. Bırakma sürecinde bir hekimden veya sigara bırakma polikliniğinden profesyonel destek almanız faydalı olabilir." }
];

const STORAGE_KEY = "nikotin-degerlendirme-v1";

/* ============================================================
   2) PUANLAMA
   ============================================================ */
const MAX_SCORE = QUESTIONS.reduce((sum, q) => sum + Math.max(...q.options.map(o => o.score)), 0);

function calculateScore(answers) {
  return QUESTIONS.reduce((sum, q, i) => {
    const idx = answers[i];
    return sum + (Number.isInteger(idx) && q.options[idx] ? q.options[idx].score : 0);
  }, 0);
}
function getLevel(score) {
  return LEVELS.find(l => score >= l.min && score <= l.max) || LEVELS[LEVELS.length - 1];
}

/* ============================================================
   3) DURUM ve GEÇİCİ SAKLAMA (yalnızca tarayıcı, sunucuya gönderilmez)
   step: -1 = ana sayfa, 0..n-1 = soru, n = sonuç
   ============================================================ */
const state = { step: -1, answers: new Array(QUESTIONS.length).fill(null) };

function saveState() {
  try { sessionStorage.setItem(STORAGE_KEY, JSON.stringify(state)); } catch (e) {}
}
function clearState() {
  try { sessionStorage.removeItem(STORAGE_KEY); } catch (e) {}
}
function loadState() {
  try {
    const raw = sessionStorage.getItem(STORAGE_KEY);
    if (!raw) return;
    const data = JSON.parse(raw);
    if (!data || !Array.isArray(data.answers) || data.answers.length !== QUESTIONS.length) return;
    const valid = data.answers.every((a, i) => a === null || (Number.isInteger(a) && QUESTIONS[i].options[a]));
    if (!valid) return;
    state.answers = data.answers;
    let step = Number.isInteger(data.step) ? data.step : -1;
    step = Math.min(Math.max(step, -1), QUESTIONS.length);
    // Sonuç ekranına yalnızca tüm sorular cevaplanmışsa izin ver
    if (step === QUESTIONS.length && state.answers.some(a => a === null)) {
      step = state.answers.findIndex(a => a === null);
    }
    state.step = step;
  } catch (e) {}
}

/* ============================================================
   4) GÖRÜNÜM
   ============================================================ */
const app = document.getElementById("app");
const ICON_CHECK = '<svg viewBox="0 0 16 16" fill="none" aria-hidden="true"><path d="M3 8.5l3.2 3.2L13 4.8" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/></svg>';
const ICON_INFO = '<svg width="20" height="20" viewBox="0 0 24 24" fill="none" aria-hidden="true"><circle cx="12" cy="12" r="9.5" stroke="currentColor" stroke-width="2"/><path d="M12 11v5.5M12 7.6v.1" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"/></svg>';

function esc(s) {
  return String(s).replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
}

function renderHome() {
  document.title = "Sigara Kullanımı ve Nikotin Bağımlılığı Değerlendirmesi";
  app.innerHTML = `
    <section class="card" aria-labelledby="title">
      <h1 id="title" tabindex="-1">Sigara Kullanımı ve Nikotin Bağımlılığı Değerlendirmesi</h1>
      <p class="lead">Aşağıdaki ${QUESTIONS.length} soruyu cevaplayarak sigara kullanımınıza ilişkin nikotin bağımlılığı düzeyinizi bilgilendirme amaçlı değerlendirebilirsiniz.</p>
      <ul class="home-facts">
        <li>${QUESTIONS.length} kısa soru</li>
        <li>Yaklaşık 1 dakika</li>
        <li>Kişisel bilgi istenmez</li>
      </ul>
      <button type="button" class="btn btn-primary btn-lg" id="start">Değerlendirmeye Başla</button>
      <div class="notice" role="note">
        ${ICON_INFO}
        <p>Bu değerlendirme bir tıbbi tanı yerine geçmez. Sonuçlar yalnızca bilgilendirme amacıyla kullanılmalıdır.</p>
      </div>
    </section>`;
  document.getElementById("start").addEventListener("click", () => {
    const firstOpen = state.answers.findIndex(a => a === null);
    goTo(firstOpen === -1 ? 0 : 0);
  });
}

function renderQuestion() {
  const i = state.step;
  const q = QUESTIONS[i];
  const total = QUESTIONS.length;
  const pct = Math.round((i / total) * 100);
  const selected = state.answers[i];
  const isLast = i === total - 1;
  document.title = `Soru ${i + 1} / ${total} – Nikotin Bağımlılığı Değerlendirmesi`;

  app.innerHTML = `
    <div class="progress">
      <div class="progress-top">
        <span class="progress-label" id="plabel">Soru ${i + 1} / ${total}</span>
        <span class="progress-pct" aria-hidden="true">%${pct} tamamlandı</span>
      </div>
      <div class="bar" role="progressbar" aria-labelledby="plabel" aria-valuemin="0" aria-valuemax="${total}" aria-valuenow="${i + 1}" aria-valuetext="${total} sorudan ${i + 1}. soru">
        <div class="bar-fill" style="width:${((i + 1) / total) * 100}%"></div>
      </div>
    </div>
    <form class="card" id="qform" novalidate>
      <fieldset>
        <legend><h2 id="qtitle" tabindex="-1">${esc(q.text)}</h2></legend>
        <div class="options">
          ${q.options.map((o, k) => `
            <label class="option">
              <input type="radio" name="${esc(q.id)}" value="${k}" ${selected === k ? "checked" : ""}>
              <span class="option-body"><span class="mark">${ICON_CHECK}</span><span>${esc(o.label)}</span></span>
            </label>`).join("")}
        </div>
      </fieldset>
      <div class="nav">
        <button type="button" class="btn btn-secondary" id="back">Geri</button>
        <button type="submit" class="btn btn-primary" id="next" ${selected === null ? "disabled" : ""}>${isLast ? "Sonucu Gör" : "Devam Et"}</button>
      </div>
    </form>`;

  const form = document.getElementById("qform");
  const next = document.getElementById("next");
  form.addEventListener("change", e => {
    if (e.target.name !== q.id) return;
    state.answers[i] = Number(e.target.value);
    next.disabled = false;
    saveState();
  });
  form.addEventListener("submit", e => {
    e.preventDefault();
    if (state.answers[i] === null) return;   // cevap yoksa ilerleme yok
    goTo(i + 1);
  });
  document.getElementById("back").addEventListener("click", () => goTo(i - 1));
}

function renderResult() {
  const score = calculateScore(state.answers);
  const level = getLevel(score);
  document.title = "Değerlendirme Tamamlandı – Nikotin Bağımlılığı Değerlendirmesi";

  const cells = Array.from({ length: MAX_SCORE + 1 }, (_, n) => {
    const lv = getLevel(n);
    return `<span class="cell ${n <= score ? "on" : ""} ${n === score ? "current" : ""}" style="--c:${lv.color}"></span>`;
  }).join("");
  const nums = Array.from({ length: MAX_SCORE + 1 }, (_, n) => `<span>${n}</span>`).join("");
  const chips = LEVELS.map(l => `
    <div class="level-chip ${l.key === level.key ? "active" : ""}" style="--c:${l.color}" ${l.key === level.key ? 'aria-current="true"' : ""}>
      <span class="dot" aria-hidden="true"></span>${l.short}
      <small>${l.min} - ${l.max} puan</small>
    </div>`).join("");
  const answerRows = QUESTIONS.map((q, i) => `
    <li><span>${i + 1}. ${esc(q.text)}</span><span>${esc(q.options[state.answers[i]].label)}</span></li>`).join("");

  app.innerHTML = `
    <section class="card" aria-labelledby="rtitle">
      <div class="result-head">
        <p class="kicker">Değerlendirme Tamamlandı</p>
        <h2 id="rtitle" tabindex="-1" class="sr-only">Değerlendirme sonucu</h2>
        <p class="score" aria-label="Toplam puanınız ${MAX_SCORE} üzerinden ${score}">Toplam Puanınız: ${score}<small>/ ${MAX_SCORE}</small></p>
        <p class="level-name" data-level="${level.key}">${esc(level.name)}</p>
      </div>

      <div class="gauge" role="img" aria-label="Düşük, orta, yüksek ölçeğinde konumunuz: ${esc(level.short)}">
        <div class="cells">${cells}</div>
        <div class="cell-nums" aria-hidden="true">${nums}</div>
        <div class="levels">${chips}</div>
      </div>

      <div class="result-note" role="note">
        <strong>Bilgilendirme</strong>
        Bu sonuç yalnızca bilgilendirme amaçlıdır ve tek başına tıbbi tanı anlamına gelmez.
      </div>
      <p class="result-extra">${esc(level.extra)} Ücretsiz danışmanlık için Sağlık Bakanlığı Alo 171 hattını da arayabilirsiniz.</p>

      <div class="answers">
        <h3>Cevaplarınız</h3>
        <ul>${answerRows}</ul>
      </div>

      <div class="actions">
        <button type="button" class="btn btn-primary" id="restart">Yeniden Değerlendir</button>
        <button type="button" class="btn btn-secondary" id="print">Sonucu Yazdır</button>
      </div>
    </section>`;

  document.getElementById("restart").addEventListener("click", restart);
  document.getElementById("print").addEventListener("click", () => window.print());
}

/* ============================================================
   5) YÖNLENDİRME
   ============================================================ */
function goTo(step) {
  const total = QUESTIONS.length;
  step = Math.min(Math.max(step, -1), total);
  // Güvenlik: bir soruya veya sonuca, önceki sorular cevapsızken geçilemez
  if (step > 0) {
    const firstOpen = state.answers.findIndex(a => a === null);
    if (firstOpen !== -1 && step > firstOpen) step = firstOpen;
  }
  state.step = step;
  saveState();
  render(true);
}

function restart() {
  state.answers = new Array(QUESTIONS.length).fill(null);
  state.step = -1;
  clearState();
  render(true);
}

function render(moveFocus) {
  if (state.step === -1) renderHome();
  else if (state.step >= QUESTIONS.length) renderResult();
  else renderQuestion();
  if (moveFocus) {
    const h = app.querySelector("h1, h2");
    if (h) h.focus({ preventScroll: true });
    window.scrollTo({ top: 0 });
  }
}

loadState();
render(false);
</script>
